services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      PORT: ${BACKEND_PORT:-3000}
      ENABLED_PROVIDERS: ${ENABLED_PROVIDERS:-manual}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-manual}
      MANUAL_MESSAGE: ${MANUAL_MESSAGE:-HELLO VESTAFREE}
      MANUAL_POLL_INTERVAL_MS: ${MANUAL_POLL_INTERVAL_MS:-2000}
      WEATHER_CITY: ${WEATHER_CITY:-}
      WEATHER_CONDITIONS: ${WEATHER_CONDITIONS:-UNKNOWN}
      WEATHER_TEMP_F: ${WEATHER_TEMP_F:-}
      WEATHER_POLL_INTERVAL_MS: ${WEATHER_POLL_INTERVAL_MS:-60000}
      FLIGHT_NUMBER: ${FLIGHT_NUMBER:-}
      FLIGHT_STATUS: ${FLIGHT_STATUS:-UNKNOWN}
      FLIGHT_GATE: ${FLIGHT_GATE:-TBD}
      FLIGHT_POLL_INTERVAL_MS: ${FLIGHT_POLL_INTERVAL_MS:-45000}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    networks:
      - vestafree
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file:
      - .env
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      API_BASE_URL: ${API_BASE_URL:-http://backend:3000}
      FRONTEND_REFRESH_INTERVAL_MS: ${FRONTEND_REFRESH_INTERVAL_MS:-10000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    networks:
      - vestafree
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  vestafree:
    driver: bridge
